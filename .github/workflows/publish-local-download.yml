name: Publish local download bundles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: local-download-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and pack
        run: |
          npm ci
          bash scripts/pack-local.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecg-stimulator-local
          path: local-bundle/*.zip

      - name: Publish rolling GitHub Release (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=local-latest
          NOTES='Local copy of the ECG Stimulator for viewing and debugging on your own computer.

          把模拟器下载到自己电脑上查看或调试。入口说明见仓库 README：
          https://github.com/CarryLewis/ECG-stimulator#本地下载与调试

          - **ecg-stimulator-view.zip** — prebuilt static UI. Unzip, run `view.sh` / `view.bat`, open http://127.0.0.1:4173
          - **ecg-stimulator-source.zip** — full source. `npm ci && npm run dev` to debug

          Do not open `index.html` via `file://`.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              local-bundle/ecg-stimulator-view.zip \
              local-bundle/ecg-stimulator-source.zip \
              --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" \
              local-bundle/ecg-stimulator-view.zip \
              local-bundle/ecg-stimulator-source.zip \
              --title "Local download (latest)" \
              --notes "$NOTES"
          fi
